services:
  app:
    build: .
    restart: unless-stopped
    environment:
      HOST_SECRET: ${HOST_SECRET:?set HOST_SECRET in .env}
      PUBLIC_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
    volumes:
      - poll-data:/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
volumes:
  poll-data:
    name: together-live-poll-data
  caddy-data:
  caddy-config:
